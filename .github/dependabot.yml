version: 2
# Checked against the repo tree: pyproject.toml and requirements.txt at the
# root for pip, 3 workflow files for github-actions. Note
# pypa/gh-action-pypi-publish@release/v1 is a branch ref and is not updatable.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
